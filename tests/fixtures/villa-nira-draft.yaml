# A listing draft for an invented villa. Nothing here is real: the property, the
# address, the coordinates, the prices and the network name are all made up, and the
# prose is hard-wrapped on purpose so the builders' unwrapping is exercised.
property_name: Nira
portfolio: DEMO

title: Villa Nira — clifftop pool villa
summary: |
  Villa Nira stands on the clifftop above the bay, four bedrooms wrapped around
  a long infinity pool.

the_space: |
  🛏️ SLEEPING
  Bedroom one opens straight onto the pool deck and has its own ensuite, an
  outdoor shower and a view down the cliff.

inventory_by_room: |
  Bedroom one: king bed, ensuite, pool access
  Bedroom two: king bed, ensuite

access: |
  1. The gate code is in your arrival message, and the keypad sits on the left
  as you face the gate.
  2. The house key hangs in the lockbox by the front door.

interaction: |
  The host lives ten minutes away and answers messages all day; nobody will call
  in unless you ask.

neighbourhood: |
  A quiet lane of family compounds, with the surf break and two warungs a short
  walk downhill.

transit: |
  The airport is fifty minutes by car outside peak hours, and we can arrange the
  pickup for you.

other_things_to_note: |
  The cliff path is unlit after dark, so bring a torch or use the stairs by the
  pool instead.

